<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <title>WebPOS — Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{font-size:16px;font-family:'Inter',sans-serif}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:1rem;position:relative;overflow:hidden;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    }
    .bg-shapes{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;z-index:0}
    .shape{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6;animation:float 20s infinite ease-in-out}
    .shape-1{width:400px;height:400px;background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);top:-100px;left:-100px}
    .shape-2{width:300px;height:300px;background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);bottom:-50px;right:-50px;animation-delay:-5s}
    @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-30px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.9)}}
    .login-container{position:relative;z-index:1;width:100%;max-width:420px}
    .glass-card{
      background:rgba(255,255,255,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-radius:24px;border:1px solid rgba(255,255,255,.3);
      box-shadow:0 25px 50px -12px rgba(0,0,0,.25);padding:2.5rem;
      animation:slideUp .6s ease;
    }
    @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    .logo-section{text-align:center;margin-bottom:2rem}
    .logo-icon{
      width:80px;height:80px;background:linear-gradient(135deg,#6366f1,#ec4899);
      border-radius:20px;display:flex;align-items:center;justify-content:center;
      margin:0 auto 1rem;box-shadow:0 10px 30px rgba(99,102,241,.4);animation:pulse 2s infinite;
    }
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    .logo-icon i{font-size:2.5rem;color:#fff}
    .logo-title{font-size:1.75rem;font-weight:800;color:#fff;margin-bottom:.25rem;text-shadow:0 2px 10px rgba(0,0,0,.1)}
    .logo-subtitle{font-size:.875rem;color:rgba(255,255,255,.8)}
    .form-group{margin-bottom:1.25rem}
    .form-label{display:block;font-size:.875rem;font-weight:600;color:rgba(255,255,255,.9);margin-bottom:.5rem}
    .input-wrapper{position:relative}
    .input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.6);font-size:1rem}
    .form-input{
      width:100%;padding:.875rem 1rem .875rem 2.75rem;
      background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
      border-radius:12px;color:#fff;font-size:.875rem;font-family:inherit;transition:all .2s;
    }
    .form-input::placeholder{color:rgba(255,255,255,.5)}
    .form-input:focus{outline:none;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);box-shadow:0 0 0 3px rgba(255,255,255,.1)}
    .password-toggle{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:1rem;transition:color .2s}
    .password-toggle:hover{color:#fff}
    .form-options{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;font-size:.875rem}
    .remember-me{display:flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.8);cursor:pointer}
    .remember-me input{width:18px;height:18px;accent-color:#6366f1}
    .forgot-password{color:rgba(255,255,255,.8);text-decoration:none;transition:color .2s}
    .forgot-password:hover{color:#fff;text-decoration:underline}
    .btn{
      width:100%;padding:1rem;background:linear-gradient(135deg,#6366f1,#4f46e5);
      border:none;border-radius:12px;color:#fff;font-size:.875rem;font-weight:600;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;
      box-shadow:0 4px 15px rgba(99,102,241,.4);transition:all .3s;
    }
    .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.5)}
    .btn:disabled{opacity:.7;cursor:not-allowed}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .register-link{text-align:center;margin-top:1.5rem;color:rgba(255,255,255,.8);font-size:.875rem}
    .register-link a{color:#fff;font-weight:600;text-decoration:none}
    .register-link a:hover{text-decoration:underline}
    .alert{padding:.875rem 1rem;border-radius:12px;margin-bottom:1rem;font-size:.875rem;display:flex;align-items:center;gap:.75rem;animation:slideUp .3s ease}
    .alert-error{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.3);color:#fecaca}
    .alert-success{background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.3);color:#a7f3d0}
    .alert-warning{background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.3);color:#fde68a}
    .version{text-align:center;margin-top:1.5rem;font-size:.75rem;color:rgba(255,255,255,.5)}
    @media(max-width:480px){.glass-card{padding:1.5rem}.logo-icon{width:60px;height:60px}.logo-icon i{font-size:2rem}.logo-title{font-size:1.5rem}}
  </style>
<base target="_blank">
</head>
<body>
  <div class="bg-shapes"><div class="shape shape-1"></div><div class="shape shape-2"></div></div>
  <div class="login-container">
    <div class="glass-card">
      <div class="logo-section">
        <div class="logo-icon"><i class="fas fa-cash-register"></i></div>
        <h1 class="logo-title">WebPOS</h1>
        <p class="logo-subtitle">Sistem Kasir Modern</p>
      </div>
      <div id="alertContainer"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-input" id="username" placeholder="Masukkan username" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-input" id="password" placeholder="Masukkan password" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="togglePassword"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-options">
          <label class="remember-me"><input type="checkbox" id="rememberMe"><span>Ingat saya</span></label>
          <a href="#" class="forgot-password" id="forgotPassword">Lupa password?</a>
        </div>
        <button type="submit" class="btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i><span>Masuk</span></button>
      </form>
      <div class="register-link">Belum punya akun? <a href="register.html">Daftar sekarang</a></div>
      <div class="version">WebPOS v3.0.0</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=2"></script>
  <script src="js/utils.js?v=3"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePassword');
      const loginBtn = document.getElementById('loginBtn');
      const alertBox = document.getElementById('alertContainer');
      const rememberMe = document.getElementById('rememberMe');

      // Load saved username
      const saved = localStorage.getItem('webpos_username');
      if(saved){ usernameInput.value = saved; rememberMe.checked = true; }

      // Toggle password
      toggleBtn.addEventListener('click', () => {
        const isPass = passwordInput.type === 'password';
        passwordInput.type = isPass ? 'text' : 'password';
        toggleBtn.innerHTML = isPass ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
      });

      function showAlert(msg, type){
        const icons = {error:'exclamation-circle', success:'check-circle', warning:'exclamation-triangle'};
        alertBox.innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${icons[type]}"></i><span>${msg}</span></div>`;
        setTimeout(() => alertBox.innerHTML = '', 5000);
      }
      function setLoading(on){
        if(on){ loginBtn.disabled = true; loginBtn.innerHTML = '<div class="spinner"></div><span>Memuat...</span>'; }
        else { loginBtn.disabled = false; loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Masuk</span>'; }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if(!username || !password){ showAlert('Username dan password wajib diisi','error'); return; }
        setLoading(true);
        const result = await Auth.login(username, password);
        if(result.success){
          if(rememberMe.checked) localStorage.setItem('webpos_username', username);
          else localStorage.removeItem('webpos_username');
          showAlert('Login berhasil! Mengalihkan...','success');
          setTimeout(() => window.location.href = 'index.html', 800);
        } else {
          setLoading(false);
          if(result.error === 'pending_approval') showAlert(result.message || 'Akun pending','warning');
          else if(result.error === 'rejected') showAlert(result.message || 'Akun ditolak','error');
          else if(result.error === 'suspended') showAlert(result.message || 'Akun ditangguhkan','error');
          else showAlert(result.message || 'Login gagal','error');
        }
      });

      document.getElementById('forgotPassword').addEventListener('click', async (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        if(!username){ showAlert('Masukkan username dulu','error'); return; }
        try {
          const snap = await database.ref('users').orderByChild('username').equalTo(Utils.formatUsername(username)).once('value');
          const users = snap.val();
          if(!users){ showAlert('Username tidak ditemukan','error'); return; }
          const u = Object.values(users)[0];
          if(u.email && !u.email.includes('@webpos.local')){
            await Auth.sendPasswordReset(u.email);
            showAlert('Email reset password telah dikirim','success');
          } else { showAlert('User tidak memiliki email valid','error'); }
        } catch(err){ showAlert('Gagal mengirim reset','error'); }
      });
    });
  </script>
</body>
</html>
